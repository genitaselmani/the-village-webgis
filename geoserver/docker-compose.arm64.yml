# Varianti për Oracle Cloud Always Free (Ampere A1 = ARM64).
#
# Imazhi zyrtar docker.osgeo.org/geoserver ndërtohet VETËM për amd64 dhe nuk niset
# fare në ARM. kartoza/geoserver ofron arm64, prandaj përdoret këtu.
#
#   docker compose -f docker-compose.arm64.yml up -d

services:
  geoserver:
    image: kartoza/geoserver:2.28.4
    container_name: thevillage-geoserver
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Kredencialet lexohen nga .env — MOS i shkruaj drejtpërdrejt këtu.
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}

      # Pa CORS, shfletuesi i bllokon kërkesat WMS/WFS që vijnë nga një domen tjetër
      # (p.sh. faqja në github.io) — shërbimet do të dukeshin "të vdekura" në WebGIS.
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "*"
      CORS_ALLOWED_METHODS: "GET,POST,PUT,HEAD,OPTIONS"
      CORS_ALLOWED_HEADERS: "*"

      SAMPLE_DATA: "false"
      INITIAL_MEMORY: "512M"
      MAXIMUM_MEMORY: "2G"
    volumes:
      - geoserver_data:/opt/geoserver/data_dir
      # GeoPackage-u; montohet vetëm për lexim.
      # Ky është shtegu që i jepet skriptit si GPKG_PATH.
      - ./thevillage.gpkg:/opt/geoserver/data_dir/data/thevillage.gpkg:ro

volumes:
  geoserver_data:
