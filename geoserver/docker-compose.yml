services:
  geoserver:
    image: docker.osgeo.org/geoserver:2.25.3
    container_name: thevillage-geoserver
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Kredencialet lexohen nga skedari .env — MOS i shkruaj drejtpërdrejt këtu.
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}

      # Pa CORS, shfletuesi i bllokon kërkesat WMS/WFS që vijnë nga një domen tjetër
      # (p.sh. faqja në github.io) — shërbimet do të dukeshin "të vdekura" në WebGIS.
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "*"
      CORS_ALLOWED_METHODS: "GET,POST,PUT,HEAD,OPTIONS"
      CORS_ALLOWED_HEADERS: "*"

      SKIP_DEMO_DATA: "true"
      # Kufi kujtese i përshtatshëm për një VM të vogël (1-2 GB RAM).
      EXTRA_JAVA_OPTS: "-Xms256m -Xmx1g"
    volumes:
      # Katalogu i GeoServer-it: mban workspace-t, stilet dhe konfigurimin e shtresave.
      - ./data_dir:/opt/geoserver_data
      # Të dhënat vetë; montohen vetëm për lexim.
      - ./thevillage.gpkg:/opt/geoserver_data/data/thevillage.gpkg:ro
